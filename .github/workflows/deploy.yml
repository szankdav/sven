name: Deploy docker image to GHCR
on:
  push:
    branches:
      - production
jobs:
  playwright-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Build the app
        run: npm run build
      - name: Install wait-on package
        run: npm install wait-on
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Start the app in the background
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          PORT: ${{ secrets.PORT }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          DISABLE_LOKI: true
        run: npm start & npx wait-on http://localhost:3000 && npm run playwright-prod
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  unit-test:
    runs-on: ubuntu-latest
    needs: playwright-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test
  deploy:
    name: Deploy Docker Image
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    concurrency: deploy-group # Ensures only one deployment at a time

    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f Dockerfile.prod -t ghcr.io/szankdav/sven:latest .
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Push Docker Image to GHCR
        run: docker push ghcr.io/szankdav/sven:latest

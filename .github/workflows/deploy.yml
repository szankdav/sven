name: Deploy docker image to GHCR
on:
  push:
    branches:
      - production
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test
  playwright-test:
    timeout-minutes: 60
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Build the app
        run: npm run build
      - name: Install wait-on package
        run: npm install wait-on
      - name: Start the app in the background
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          PORT: ${{ secrets.PORT }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
        run: npm start &
      - name: Wait for the app to be ready
        run: npx wait-on http://localhost:3000
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Debug Environment
        run: |
             echo "Current directory:"
             pwd
             echo "List files:"
             ls -alh dist/logger/database/db
      - name: Run Playwright tests
        run: npm run playwright-prod
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  deploy:
    name: Deploy docker image
    needs: playwright-test
    runs-on: ubuntu-latest
    concurrency: deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build docker image
        run: docker build -t ghcr.io/szankdav/sven:latest .
      - name: Push docker image into GHCR
        run: docker push ghcr.io/szankdav/sven:latest
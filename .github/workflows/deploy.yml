name: Deploy docker image to GHCR
on:
  push:
    branches:
      - production
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test
  playwright-test:
    timeout-minutes: 60
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Build the app
        run: npm run build
      - name: Install wait-on package
        run: npm install wait-on
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Start the app in the background
        env:
          DISABLE_LOKI: true
        run: npm start & npx wait-on http://localhost:3000 && npm run playwright-prod
      # - name: Wait for the app to be ready
      #   run: npx wait-on http://localhost:3000
      # - name: Run Playwright tests
      #   run: npm run playwright-prod
      # - uses: actions/upload-artifact@v4
      #   if: ${{ !cancelled() }}
      #   with:
      #     name: playwright-report
      #     path: playwright-report/
      #     retention-days: 30
  deploy:
    name: Deploy Docker Image
    needs: playwright-test
    runs-on: ubuntu-latest
    concurrency: deploy-group # Ensures only one deployment at a time

    steps:
    # ✅ Checkout code
    - uses: actions/checkout@v4

    # ✅ Log in to GHCR
    - name: Log in to GHCR
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ secrets.GITHUB_ACTOR }}
        password: ${{ secrets.GITHUB_TOKEN }}  # GitHub automatically provides this

    # ✅ Build Docker image with caching
    - name: Build Docker Image
      run: |
        docker build --cache-from=type=local,src=/tmp/.buildx-cache \
                     --cache-to=type=local,dest=/tmp/.buildx-cache \
                     -t ghcr.io/szankdav/sven:latest .

    # ✅ Push Docker image to GHCR
    - name: Push Docker Image to GHCR
      run: docker push ghcr.io/szankdav/sven:latest